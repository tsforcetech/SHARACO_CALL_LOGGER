<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F5F7FB"><title>CallTrack Pro — Mobile UI Reference</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#15213c;background:#e9eef5;font-synthesis:none;--blue:#5145e8;--ink:#15213c;--muted:#77839b;--surface:#fff;--line:#edf0f6;--soft:#f6f8fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9ca8ff;outline-offset:2px}.desktop{min-height:100vh;display:grid;place-items:center;padding:25px}.phone{width:min(100%,410px);height:min(870px,calc(100dvh - 40px));min-height:620px;position:relative;background:var(--soft);border:8px solid #202a40;border-radius:45px;overflow:hidden;box-shadow:0 25px 80px #17213b28}.screen{height:100%;overflow-y:auto;scrollbar-width:none;padding-bottom:95px}.screen::-webkit-scrollbar{display:none}.screen.auth{padding-bottom:24px;background:white}.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:11px;font-weight:800;letter-spacing:.1px;background:transparent}.status.dark{color:#fff}.status svg{width:15px;height:15px}.top{display:flex;justify-content:space-between;align-items:center;padding:13px 21px 18px}.eyebrow{font-size:12px;color:var(--muted);font-weight:600}.head{font-size:26px;font-weight:850;letter-spacing:-1px;margin:3px 0 0}.circle{width:42px;height:42px;border-radius:14px;background:white;display:grid;place-items:center;border:1px solid var(--line);position:relative}.notification:after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:#ff6372;top:9px;right:10px;border:2px solid white}.content{padding:0 20px}.hero{border-radius:23px;background:linear-gradient(135deg,#5f52ed,#3831a9);padding:20px;color:white;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:180px;height:180px;border:30px solid #ffffff12;right:-95px;top:-75px;border-radius:50%}.hero small{font-size:12px;opacity:.8}.hero h2{margin:12px 0 5px;font-size:37px;letter-spacing:-1.4px}.hero .r{display:flex;gap:8px;align-items:center}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;background:#e7f8ef;color:#168c55;padding:6px 9px;font-size:11px;font-weight:750}.hero .pill{background:#ffffff24;color:white}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.sectionhead h3{font-size:16px;margin:0;letter-spacing:-.3px}.link{background:none;color:var(--blue);border:0;font-size:12px;font-weight:800;padding:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:16px;border-radius:19px;background:white;border:1px solid #eff1f7;min-height:118px}.metric .sym{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:#eeeefe;color:var(--blue);margin-bottom:12px;font-size:15px}.metric strong{display:block;font-size:23px;letter-spacing:-.7px}.metric span{font-size:11px;color:var(--muted);font-weight:650}.surface{background:white;border:1px solid #edf0f6;border-radius:20px;padding:16px}.chart{display:flex;align-items:end;gap:12px;height:128px;border-bottom:1px solid #e9ebf2;padding:5px 3px 0}.barwrap{display:flex;flex:1;justify-content:end;align-items:center;flex-direction:column;height:100%;gap:6px}.bar{width:100%;max-width:24px;border-radius:7px 7px 2px 2px;background:#dddafe;min-height:3px}.bar.active{background:#5548ee}.barwrap small{font-size:10px;color:#929bb0}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.avatar{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ebe9ff;color:#5145d9;font-weight:850;font-size:13px;flex-shrink:0}.avatar.green{background:#e4f8ec;color:#1c9b67}.avatar.orange{background:#fff1df;color:#d99024}.row-title{font-weight:800;font-size:13px}.row-sub{color:var(--muted);font-size:11px;margin-top:4px}.listrow{padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.right{text-align:right;margin-left:auto}.value{font-size:13px;font-weight:800}.nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:5px 8px 11px;z-index:5}.nav button{display:grid;justify-items:center;gap:4px;background:none;border:0;color:#8c95a8;font-size:10px;font-weight:700;min-width:54px}.nav button .ico{font-size:20px}.nav button.active{color:var(--blue)}.nav button.active .ico{background:#eeecff;border-radius:11px;padding:5px 13px;margin:-5px -13px}.filterbar{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:9px 0 16px}.chip{white-space:nowrap;background:white;border:1px solid var(--line);color:#6e7a91;border-radius:11px;padding:9px 12px;font-size:11px;font-weight:750}.chip.selected{background:#5145e8;color:#fff;border-color:#5145e8}.search{display:flex;align-items:center;gap:9px;background:white;border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:#97a0b2}.search input{border:0;outline:0;width:100%;background:transparent;color:var(--ink);font-size:13px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-weight:800;font-size:13px;padding:15px 18px}.btn.full{width:100%}.btn.secondary{background:#f0efff;color:var(--blue)}.btn.outline{background:white;color:var(--ink);border:1px solid var(--line)}.floating{position:absolute;bottom:91px;right:20px;z-index:3;border-radius:50%;width:53px;height:53px;display:grid;place-items:center;font-size:25px;box-shadow:0 10px 25px #5145e84d}.small{font-size:11px;color:var(--muted)}.tag{font-size:10px;font-weight:800;background:#e7f8ef;color:#119b65;padding:6px 8px;border-radius:8px}.tag.red{background:#ffedf0;color:#db5566}.tag.amber{background:#fff4dd;color:#bc8a24}.calltype{width:38px;height:38px;border-radius:13px;background:#e7f8ef;color:#15945d;display:grid;place-items:center;font-weight:900;font-size:19px;flex-shrink:0}.calltype.missed{background:#fff0f1;color:#e65c63}.calltype.out{background:#eeedff;color:#5c4eec}.divider{height:1px;background:var(--line);margin:13px 0}.inputs{display:grid;gap:14px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 7px}.field input,.field select{width:100%;padding:14px;border-radius:13px;border:1px solid #dfe4ed;background:#fff;outline:none;font-size:14px}.field input:focus{border-color:var(--blue)}.back{border:0;background:#f5f6fa;width:39px;height:39px;border-radius:13px;font-size:20px;color:var(--ink)}.authpanel{padding:24px}.authpanel h1{letter-spacing:-1.1px;font-size:29px;margin:12px 0}.authpanel p{color:var(--muted);font-size:14px;line-height:1.6}.logo{width:48px;height:48px;display:grid;place-items:center;background:var(--blue);border-radius:17px;color:white;font-size:26px;font-weight:900;box-shadow:0 10px 20px #5145e838}.logo.white{background:white;color:var(--blue)}.illustration{height:236px;display:grid;place-items:center;position:relative}.fakephone{width:170px;height:208px;background:white;border:7px solid #25294b;border-radius:26px;transform:rotate(-9deg);padding:13px;box-shadow:15px 20px 40px #130f7433}.fakephone .stub{height:18px;border-radius:8px;background:#f0efff;margin:9px 0}.fakephone .stub:nth-child(2){width:76%}.fakephone .chart{height:90px;gap:4px}.fakephone .bar{max-width:15px}.splash{height:100%;background:linear-gradient(155deg,#6558f5,#2f288c);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}.splash:before,.splash:after{content:'';position:absolute;width:320px;height:320px;border:55px solid #ffffff0a;border-radius:50%}.splash:before{top:-170px;right:-210px}.splash:after{bottom:-220px;left:-200px}.splash h1{font-size:32px;letter-spacing:-1.4px;margin:20px 0 5px}.splash p{opacity:.7;font-size:13px}.splash .footer{position:absolute;bottom:54px;font-size:12px;opacity:.7}.splash .btn{background:white;color:#4236b8;margin-top:35px;z-index:1}.onboardbox{padding:22px;background:#f7f7ff;border-radius:20px;display:flex;gap:13px;align-items:center;margin-bottom:12px}.onboardbox .sym{font-size:26px}.onboardbox strong{font-size:14px}.qr{margin:20px auto;border:12px solid #fff;box-shadow:0 0 0 1px #e1e6f1;width:194px;height:194px;border-radius:12px;display:grid;grid-template-columns:repeat(9,1fr);gap:3px;padding:8px;background:#fff}.qr i{background:#252a49;border-radius:2px}.qr i.off{background:#fff}.table-scroll{overflow:auto;background:white;border:1px solid #e9edf5;border-radius:18px}.reporttable{border-collapse:collapse;width:580px;font-size:11px}.reporttable th{position:sticky;top:0;text-align:left;color:#8b94a8;font-weight:750;background:#f9fafd}.reporttable th,.reporttable td{padding:13px 10px;border-bottom:1px solid #f0f2f7}.reporttable td{font-weight:700}.reporttable th:first-child,.reporttable td:first-child{position:sticky;left:0;background:#fff;z-index:1}.reporttable th:first-child{background:#f9fafd;z-index:2}.notice{border-radius:16px;padding:14px;background:#fff5e4;display:flex;gap:12px;color:#a77016;font-size:12px;line-height:1.5}.toggle{border:0;background:#eef0f6;color:#6d7993;border-radius:11px;padding:10px;font-weight:750}.toggle.on{background:#e3f6eb;color:#129260}@media(max-width:550px){.desktop{padding:0;display:block}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}}@media(max-height:710px){.phone{height:100dvh;min-height:0}.desktop{padding:0}.phone{border-radius:0;border:0}} 
</style></head><body><div class="desktop"><main class="phone" id="app"></main></div><script>
(()=>{'use strict';const root=document.getElementById('app');const state={screen:'splash',role:'owner',date:'Today',filter:'All',company:'Acme Solutions',employee:'Ahmed',query:'',permission:false,joined:false};const staff=[{name:'Ahmed Kareem',id:'EMP-001',initial:'AK',calls:82,talk:'2h 14m',status:'Healthy',cls:''},{name:'Jasim Ali',id:'EMP-002',initial:'JA',calls:69,talk:'1h 48m',status:'Healthy',cls:'green'},{name:'Rashid Khan',id:'EMP-003',initial:'RK',calls:57,talk:'1h 21m',status:'Delayed',cls:'orange'},{name:'Sara Thomas',id:'EMP-004',initial:'ST',calls:48,talk:'1h 12m',status:'Healthy',cls:''}];const calls=[['Ahmed Kareem','+971 50 123 4567','Outgoing','10:42 AM','04m 32s','out'],['Jasim Ali','+971 55 208 9077','Incoming','10:21 AM','02m 18s','in'],['Ahmed Kareem','+971 52 645 1120','Missed','10:02 AM','00m 00s','missed'],['Rashid Khan','+971 54 325 8811','Outgoing','09:46 AM','06m 05s','out'],['Sara Thomas','+971 50 554 3120','Rejected','09:30 AM','00m 00s','missed'],['Jasim Ali','+971 58 146 2211','Outgoing','09:10 AM','03m 10s','out']];const icon={home:'⌂',team:'♙',reports:'▥',calls:'☎',more:'☰',sync:'↻'};function status(dark=false){return `<div class="status ${dark?'dark':''}"><span>9:41</span><span>●●● ▰ ▰</span></div>`}function metrics(items){return `<div class="grid">${items.map(([i,n,l])=>`<div class="metric"><div class="sym">${i}</div><strong>${n}</strong><span>${l}</span></div>`).join('')}</div>`}function dateFilters(){return `<div class="filterbar">${['Today','Yesterday','7 Days','30 Days','Custom'].map(x=>`<button class="chip ${state.date===x?'selected':''}" data-date="${x}">${x}</button>`).join('')}</div>`}function section(t,link='',target=''){return `<div class="sectionhead"><h3>${t}</h3>${link?`<button class="link" data-go="${target}">${link} →</button>`:''}</div>`}function chart(){return `<div class="surface"><div class="row between"><div><b style="font-size:13px">Call activity</b><div class="small" style="margin-top:5px">Calls over time</div></div><span class="pill">↗ 12.8%</span></div><div class="chart">${[28,45,39,68,51,78,63,94,73,55].map((v,i)=>`<div class="barwrap"><div class="bar ${i===7?'active':''}" style="height:${v}%"></div>${i%2===0?`<small>${8+i}</small>`:'<small>&nbsp;</small>'}</div>`).join('')}</div></div>`}function nav(){const owner=[['dashboard','⌂','Home'],['team','♧','Team'],['reports','▥','Reports'],['calls','☎','Calls'],['more','☰','More']];const employee=[['employeeHome','⌂','Home'],['calls','☎','Calls'],['sync','↻','Sync'],['more','☰','More']];return `<nav class="nav">${(state.role==='owner'?owner:employee).map(([id,i,t])=>`<button data-go="${id}" class="${state.screen===id?'active':''}"><span class="ico">${i}</span><span>${t}</span></button>`).join('')}</nav>`}function shell(title,sub,content,navOn=true){return `${status()}<div class="screen"><header class="top"><div><div class="eyebrow">${sub}</div><h1 class="head">${title}</h1></div><button class="circle notification" data-go="notifications" aria-label="Notifications">♧</button></header><div class="content">${content}</div></div>${navOn?nav():''}`}function home(){return shell('Overview',state.company,`<div class="hero"><div class="row between"><small>Team calling performance</small><span class="pill"><span class="dot"></span> Live overview</span></div><h2>258 <span style="font-size:14px;font-weight:500">calls</span></h2><div class="r"><span style="font-size:12px;opacity:.85">↗ 18.4% vs previous period</span></div></div>${dateFilters()}${metrics([['↗','258','Total calls'],['☎','190','Outgoing'],['✓','137','Connected'],['↘','28','Missed'],['◷','6h 35m','Total talk time'],['∿','2m 42s','Avg call duration']])}${section('Performance trends','Details','reports')}${chart()}${section('Team leaderboard','View team','team')}<div class="surface">${staff.slice(0,3).map((s,i)=>`<div class="listrow row"><span style="font-size:12px;color:#a1aabb;width:15px">${i+1}</span><div class="avatar ${s.cls}">${s.initial}</div><div><div class="row-title">${s.name}</div><div class="row-sub">${s.talk} talk time</div></div><div class="right"><div class="value">${s.calls}</div><div class="row-sub">Calls</div></div></div>`).join('')}</div>${section('Device alerts','View all','devices')}<div class="notice"><span>⚠</span><span>1 employee has a delayed sync. Review device health to avoid missing calls.</span></div>`)}function team(){const results=staff.filter(s=>s.name.toLowerCase().includes(state.query.toLowerCase())||s.id.toLowerCase().includes(state.query.toLowerCase()));return shell('Your team','4 employees · 3 active devices',`<div class="search">⌕ <input id="search" data-search placeholder="Search employee or ID" value="${state.query.replace(/"/g,'&quot;')}"></div><div class="filterbar"><button class="chip selected">All staff (4)</button><button class="chip">Active</button><button class="chip">Invited</button></div><div class="surface">${results.map((s,i)=>`<div class="listrow row" data-tap="employee" data-index="${staff.indexOf(s)}"><div class="avatar ${s.cls}">${s.initial}</div><div style="flex:1"><div class="row-title">${s.name}</div><div class="row-sub">${s.id} · ${s.talk}</div></div><div class="right"><div class="value">${s.calls} calls</div><div style="margin-top:6px" class="tag ${s.status==='Delayed'?'amber':''}">${s.status}</div></div><span>›</span></div>`).join('')||'<p class="small">No matching employees.</p>'}</div><button class="btn floating" data-go="addEmployee" aria-label="Add employee">+</button>`)}function reports(){return shell('Reports','Team performance and insights',`${dateFilters()}<div class="row between" style="margin-bottom:15px"><button class="chip" data-go="filters">⚑ Filter staff</button><button class="chip" data-export="true">↓ Export CSV</button></div>${metrics([['▥','258','Total calls'],['◎','72.1%','Connection rate'],['◷','6h 35m','Talk time'],['⇣','28','Missed calls']])}${section('Staff performance')}<div class="table-scroll"><table class="reporttable"><thead><tr>${['Employee','Calls','Out','Connected','Missed','Talk','Rate'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${staff.map((s,i)=>`<tr data-tap="employee" data-index="${i}"><td>${s.name}</td><td>${s.calls}</td><td>${s.calls-8}</td><td>${Math.round(s.calls*.72)}</td><td>${i+3}</td><td>${s.talk}</td><td>${(67+i*2.6).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>${section('Call volume by day')}${chart()}`)}function callsPage(){const filtered=calls.filter(c=>(state.filter==='All'||c[2]===state.filter)&&(state.query===''||c.join(' ').toLowerCase().includes(state.query.toLowerCase())));return shell('Call history','All synchronized records',`<div class="search">⌕ <input data-search placeholder="Search number or employee" value="${state.query.replace(/"/g,'&quot;')}"></div><div class="filterbar">${['All','Outgoing','Incoming','Missed','Rejected'].map(t=>`<button class="chip ${state.filter===t?'selected':''}" data-filter="${t}">${t}</button>`).join('')}</div><div class="surface">${filtered.map(c=>`<div class="listrow row"><div class="calltype ${c[5]==='out'?'out':c[5]==='missed'?'missed':''}">${c[5]==='out'?'↗':c[5]==='in'?'↙':'↘'}</div><div style="flex:1;min-width:0"><div class="row-title">${c[1]}</div><div class="row-sub">${c[0]} · ${c[2]}</div></div><div class="right"><div class="value">${c[3]}</div><div class="row-sub">${c[4]}</div></div></div>`).join('')||'<p class="small">No calls match your filters.</p>'}</div>`)}function more(){return shell('Settings','Company & account',`<div class="surface row" style="margin-bottom:18px"><div class="avatar">AS</div><div><div class="row-title">${state.company}</div><div class="row-sub">${state.role==='owner'?'Company owner':'Employee account'}</div></div><span style="margin-left:auto">›</span></div><div class="surface">${[['Company profile','company'],['Devices & sync health','devices'],['Employee invitations','invitations'],['Notifications','notifications'],['Privacy & data retention','privacy'],['Switch to '+(state.role==='owner'?'employee':'owner')+' preview','switch'],['Sign out','login']].map(([n,id])=>`<div class="listrow row" data-go="${id}"><span style="font-size:16px;color:#5145e8">◈</span><div class="row-title" style="flex:1">${n}</div><span style="color:#a0a8ba">›</span></div>`).join('')}</div><div class="small" style="text-align:center;margin-top:28px">CallTrack Pro · UI reference v2.0</div>`)}function employeeHome(){return shell('Good morning, Ahmed','Your activity today',`<div class="hero"><div class="row between"><small>Personal call summary</small><span class="pill">● Monitoring on</span></div><h2>82 <span style="font-size:14px;font-weight:500">calls</span></h2><small>Your daily calling activity</small></div>${dateFilters()}${metrics([['↗','74','Outgoing'],['✓','51','Connected'],['↘','5','Missed'],['◷','2h 14m','Total talk']])}${section('Your activity')}${chart()}${section('Sync status','Details','sync')}<div class="surface row"><div class="avatar green">↻</div><div style="flex:1"><div class="row-title">All calls synced</div><div class="row-sub">Last sync 3 minutes ago</div></div><span class="tag">Healthy</span></div>${section('Recent calls','View all','calls')}<div class="surface">${calls.slice(0,3).map(c=>`<div class="listrow row"><div class="calltype ${c[5]==='out'?'out':c[5]==='missed'?'missed':''}">${c[5]==='out'?'↗':c[5]==='in'?'↙':'↘'}</div><div style="flex:1"><div class="row-title">${c[1]}</div><div class="row-sub">${c[2]}</div></div><div class="right"><div class="value">${c[3]}</div><div class="row-sub">${c[4]}</div></div></div>`).join('')}</div>`)}function sync(){return shell('Sync center','Your Android device',`<div class="hero"><small>Sync health</small><h2 style="font-size:26px">● Healthy</h2><small>Last successful sync: 3 minutes ago</small></div>${section('Device information')}<div class="surface">${[['Device','Samsung Galaxy S24'],['Call-log access',state.permission?'Granted (preview)':'Not connected · demo'],['Last sync','Today, 10:41 AM'],['Pending records','0'],['App version','2.0 UI reference']].map(([a,b])=>`<div class="listrow row between"><span class="small">${a}</span><span class="row-title">${b}</span></div>`).join('')}</div><div style="height:16px"></div><button class="btn full" data-action="sync">↻ Sync now</button><div style="height:14px"></div><div class="notice"><span>ℹ</span><span>This browser preview demonstrates sync states only. Real call-log permission and background synchronization require native Android.</span></div>`)}function basic(title,subtitle,body){return `${status()}<div class="screen auth"><div class="authpanel"><button class="back" data-back="true">‹</button><h1>${title}</h1><p>${subtitle}</p>${body}</div></div>`}function formField(label,placeholder,type='text',required=false){return `<div class="field"><label>${label}</label><input type="${type}" placeholder="${placeholder}" ${required?'required':''}></div>`}function splash(){return `<div class="splash">${status(true)}<div class="logo white" style="width:85px;height:85px;border-radius:25px;font-size:45px;z-index:1">↗</div><h1>CallTrack <span style="font-weight:450">Pro</span></h1><p>Team calls. Clear insights.</p><button class="btn" data-go="welcome">Explore the app →</button><div class="footer">YOUR TEAM, IN SYNC</div></div>`}function welcome(){return `${status()}<div class="screen auth"><div class="authpanel" style="padding-top:34px"><div class="logo">↗</div><div class="illustration"><div class="fakephone"><div style="font-size:11px;font-weight:850">Call activity ↗</div><div class="stub"></div><div class="stub"></div><div class="chart">${[33,60,47,81,59,95].map(x=>`<div class="barwrap"><div class="bar" style="height:${x}%"></div></div>`).join('')}</div></div></div><div class="eyebrow" style="color:var(--blue);letter-spacing:1px">WELCOME TO CALLTRACK PRO</div><h1>Every call.<br>Every insight.</h1><p>Stay on top of your calling team's performance with a simple, powerful mobile workspace.</p><button class="btn full" data-go="choose">Continue with Google <span style="background:white;color:#4285f4;border-radius:50%;padding:2px 6px;font-weight:900">G</span></button><p style="text-align:center;font-size:11px;margin-top:17px">UI preview: Google authentication is simulated.<br>By continuing you agree to the Terms and Privacy Policy.</p></div></div>`}function choose(){return basic('Welcome aboard','What would you like to do?',`<div class="onboardbox" data-go="create"><div class="sym">▣</div><div style="flex:1"><strong>Create a company</strong><div class="small" style="margin-top:5px">Set up your team and monitor activity.</div></div><span>›</span></div><div class="onboardbox" data-go="join"><div class="sym">⌗</div><div style="flex:1"><strong>Join a company</strong><div class="small" style="margin-top:5px">Scan your company invitation code.</div></div><span>›</span></div><button class="btn outline full" data-go="dashboard">Preview owner dashboard →</button><div style="height:10px"></div><button class="btn secondary full" data-action="employeePreview">Preview employee dashboard →</button>`)}function create(){return basic('Create company','Let’s set up your team workspace.',`<form id="companyForm" class="inputs">${formField('Company name *','e.g. Acme Solutions','text',true)}${formField('Business email','company@example.com','email')}${formField('Contact number','+971 50 000 0000','tel')}<div class="field"><label>Country</label><select><option>United Arab Emirates</option><option>India</option><option>Other</option></select></div><div class="field"><label>Industry</label><select><option>Sales & Marketing</option><option>Real Estate</option><option>Business Services</option><option>Other</option></select></div><button class="btn full" type="submit">Create workspace →</button></form>`)}function join(){return basic('Join your team','Scan the QR invitation shared by your company administrator.',`<div class="surface" style="padding:26px;text-align:center"><div style="font-size:65px;color:var(--blue)">⌗</div><div class="row-title">Scan invitation QR</div><p class="small">A native Android camera scanner will appear here.</p><button class="btn secondary full" data-go="joined">Simulate scanning QR →</button></div>${section('Or enter join code')}<div class="inputs">${formField('Invitation code','e.g. ACME-X7F2')}<button class="btn full" data-go="joined">Verify invitation</button></div>`)}function joined(){return basic('Invitation verified','You have been invited to join this company.',`<div class="surface" style="text-align:center;padding:24px"><div class="avatar" style="margin:0 auto 12px;width:65px;height:65px">AS</div><h3 style="margin:0">${state.company}</h3><p>Employee: Ahmed Kareem<br>Staff ID: EMP-001</p><span class="tag">Valid invitation</span></div><div style="height:24px"></div><button class="btn full" data-go="permissions">Accept and continue →</button>`)}function permissions(){return basic('Set up call monitoring','Allow access to call metadata so your activity can sync with your company.',`<div class="onboardbox"><div class="sym">☎</div><div style="flex:1"><strong>Call history access</strong><div class="small">Number, call type, time, duration</div></div><span class="tag ${state.permission?'':'amber'}">${state.permission?'Granted':'Required'}</span></div><div class="onboardbox"><div class="sym">♧</div><div style="flex:1"><strong>Notifications</strong><div class="small">Sync health and helpful alerts</div></div><span class="tag">Optional</span></div><div class="notice"><span>ⓘ</span><span>No call audio or microphone recording. Android permission requests will be implemented in the native app.</span></div><div style="height:22px"></div><button class="btn full" data-action="permission">${state.permission?'Continue to dashboard →':'Simulate permission approval'}</button>`)}function addEmployee(){return basic('Add an employee','Create a staff profile, then share their secure join invitation.',`<form id="employeeForm" class="inputs">${formField('Full name *','Employee full name','text',true)}${formField('Employee code *','EMP-005','text',true)}${formField('Email address','staff@company.com','email')}<div class="field"><label>Department</label><select><option>Cold Calling</option><option>Sales</option><option>Customer Support</option></select></div><button class="btn full" type="submit">Generate invitation →</button></form>`)}function invitations(){return basic('Employee invitation','Share this invitation with a team member.',`<div class="surface" style="text-align:center"><h3>Join ${state.company}</h3><p class="small">Secure employee enrollment · UI demo</p><div class="qr">${Array.from({length:81},(_,i)=>`<i class="${(i*13+Math.floor(i/9)*7)%5<2?'off':''}"></i>`).join('')}</div><p style="font-weight:900;letter-spacing:3px">ACME-X7F2</p><span class="small">Expires in 24 hours · single-use invitation in production</span></div><div style="height:20px"></div><button class="btn full" data-action="copy">Copy invitation code</button><div style="height:10px"></div><button class="btn secondary full" data-go="team">Go to team</button>`)}function employee(){const s=staff[state.staffIndex||0];return basic(s.name,`${s.id} · Employee performance`,`<div class="row surface"><div class="avatar">${s.initial}</div><div style="flex:1"><strong>${s.name}</strong><div class="row-sub">Cold Calling · Active</div></div><span class="tag ${s.status==='Delayed'?'amber':''}">${s.status}</span></div><div style="height:18px"></div>${metrics([['☎',s.calls,'Total calls'],['✓',Math.round(s.calls*.72),'Connected'],['◷',s.talk,'Talk time'],['◎','71.3%','Connection rate']])}${section('Daily performance')}${chart()}<div style="height:17px"></div><button class="btn full" data-go="calls">View call history</button>`)}function devices(){return basic('Device health','Monitor last sync, app permissions and device status.',`<div class="notice"><span>⚠</span><span>Rashid Khan has not synchronized recently. Last successful sync was 9 hours ago.</span></div><div style="height:16px"></div><div class="surface">${staff.map((s,i)=>`<div class="listrow row"><div class="avatar ${s.cls}">${s.initial}</div><div style="flex:1"><div class="row-title">${s.name}</div><div class="row-sub">${i===2?'9h ago':'3–14 min ago'} · Android device</div></div><span class="tag ${s.status==='Delayed'?'amber':''}">${s.status}</span></div>`).join('')}</div>`)}function filters(){return basic('Report filters','Customize staff reports.',`<div class="field"><label>Employee</label><select><option>All employees</option>${staff.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div style="height:14px"></div><div class="field"><label>Department</label><select><option>All departments</option><option>Cold Calling</option><option>Sales</option></select></div><div style="height:24px"></div><button class="btn full" data-go="reports">Apply filters</button>`)}function notifications(){return basic('Notifications','Recent activity and team alerts.',`<div class="surface"><div class="listrow"><b>⚠ Sync delayed</b><p class="small">Rashid's device needs attention · 18 min ago</p></div><div class="listrow"><b>✓ Invitation accepted</b><p class="small">Ahmed joined your team · Today</p></div><div class="listrow"><b>↗ Weekly activity</b><p class="small">Your team call volume is trending upward.</p></div></div>`)}function generic(title){return basic(title,'Preview of the selected application settings.',`<div class="surface"><p class="small">This section will use real Firebase data in the native Android build. Navigation and layout are represented here for the visual specification.</p></div><div style="height:14px"></div><button class="btn full" data-go="more">Back to settings</button>`)}function view(){let s=state.screen;let body=s==='splash'?splash():s==='welcome'||s==='login'?welcome():s==='choose'?choose():s==='create'?create():s==='join'?join():s==='joined'?joined():s==='permissions'?permissions():s==='dashboard'?home():s==='team'?team():s==='reports'?reports():s==='calls'?callsPage():s==='more'?more():s==='employeeHome'?employeeHome():s==='sync'?sync():s==='addEmployee'?addEmployee():s==='invitations'?invitations():s==='employee'?employee():s==='devices'?devices():s==='filters'?filters():s==='notifications'?notifications():generic(s==='company'?'Company profile':'Privacy & data retention');root.innerHTML=body;root.querySelector('.screen')?.scrollTo(0,0)}function go(s){state.screen=s;state.query='';view()}root.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-date],[data-filter],[data-back],[data-action],[data-tap],[data-export]');if(!t)return;if(t.dataset.go){if(t.dataset.go==='switch'){state.role=state.role==='owner'?'employee':'owner';go(state.role==='owner'?'dashboard':'employeeHome')}else{if(t.dataset.go==='dashboard')state.role='owner';go(t.dataset.go)}}else if(t.dataset.date){state.date=t.dataset.date;view()}else if(t.dataset.filter){state.filter=t.dataset.filter;view()}else if(t.dataset.back){go(['create','join','joined'].includes(state.screen)?'choose':['permissions'].includes(state.screen)?'joined':['employee','invitations','addEmployee'].includes(state.screen)?'team':['devices','company','privacy','notifications'].includes(state.screen)?'more':'dashboard')}else if(t.dataset.tap==='employee'){state.staffIndex=Number(t.dataset.index)||0;go('employee')}else if(t.dataset.action==='employeePreview'){state.role='employee';go('employeeHome')}else if(t.dataset.action==='permission'){if(!state.permission){state.permission=true;view()}else{state.role='employee';go('employeeHome')}}else if(t.dataset.action==='sync'){alert('UI demo: synchronization completed. Real syncing requires Android and Firebase.')}else if(t.dataset.action==='copy'){try{await navigator.clipboard.writeText('ACME-X7F2');alert('Demo invitation code copied.')}catch{alert('Demo invitation: ACME-X7F2')}}else if(t.dataset.export){let csv='Employee,Calls,Talk Time\n'+staff.map(s=>[s.name,s.calls,s.talk].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='calltrack_demo_report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});root.addEventListener('input',e=>{if(e.target.matches('[data-search]')){const p=e.target.selectionStart;state.query=e.target.value;const box=e.target.closest('.screen');const y=box?.scrollTop||0;view();const input=root.querySelector('[data-search]');input?.focus();input?.setSelectionRange(p,p);root.querySelector('.screen').scrollTop=y}});root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='companyForm'){const name=e.target.querySelector('input').value.trim();if(!name)return;state.company=name;state.role='owner';go('dashboard')}if(e.target.id==='employeeForm')go('invitations')});view()})();
</script></body></html>
