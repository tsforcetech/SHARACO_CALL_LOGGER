name: Build signed release
on:
  workflow_dispatch:
  push:
    branches: ['codex/calltrack-pro-rebuild']
    paths: ['.github/workflows/build-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Build with existing signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$SIGNING_STORE_PASSWORD" && test -n "$SIGNING_KEY_ALIAS" && test -n "$SIGNING_KEY_PASSWORD"
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$SIGNING_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$SIGNING_KEYSTORE_PATH"
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CallTrack-Pro-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
